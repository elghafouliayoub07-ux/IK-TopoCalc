name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Engine verification
        run: |
          chmod +x gradlew
          ./gradlew :topo-engine:verifyEngine --no-daemon

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          V=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/IK_TopoCalc_v${V}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: IK_TopoCalc-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Publish APK (release + apk branch)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          gh release delete "v$V" -y --cleanup-tag || true
          gh release create "v$V" out/*.apk --target "$GITHUB_SHA" \
            -t "IK TopoCalc v$V" -n "APK (debug build, signed with the project's fixed key: installs over earlier versions without losing data)."
          cd out
          git init -q -b apk
          git add *.apk
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "APK v$V ($GITHUB_SHA)"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk
