name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Engine verification
        run: |
          chmod +x gradlew
          ./gradlew :topo-engine:verifyEngine --no-daemon

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          V=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/IK_TopoCalc_v${V}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: IK_TopoCalc-apk
          path: out/*.apk
          if-no-files-found: error
